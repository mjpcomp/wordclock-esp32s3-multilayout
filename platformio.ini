; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = YD_ESP32S3_N16R8

[env:ESP8266]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
board_build.f_cpu = 160000000L
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#b67b7828b9192fcbbc3f723c15b2bfa83e6a22fd
    claws/BH1750@^1.3.0
extra_scripts =
    pre:extra_scripts.py

[env:ESP32]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#b67b7828b9192fcbbc3f723c15b2bfa83e6a22fd
    claws/BH1750@^1.3.0
extra_scripts =
    pre:extra_scripts.py

[env:ESP32C3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitc-02
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@^2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#b67b7828b9192fcbbc3f723c15b2bfa83e6a22fd
    claws/BH1750@^1.3.0
extra_scripts =
    pre:extra_scripts.py

; YD-ESP32-23 N16R8: 16 MB quad flash and 8 MB octal PSRAM.
; This is a build profile, not confirmation of a successful board port.
[env:YD_ESP32S3_N16R8]
extends = env:ESP32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    ${env:ESP32.build_flags}
    -DBOARD_HAS_PSRAM
    -DWORDCLOCK_BOARD_YD_ESP32S3_N16R8=1

; Build-only isolated profiles; diagnostics and hardware validation still pending.
; The default environment above remains normal mode. Always select -e explicitly.
[env:YD_ESP32S3_N16R8_BOARD_ONLY]
extends = env:YD_ESP32S3_N16R8
build_flags =
    ${env:YD_ESP32S3_N16R8.build_flags}
    -DWORDCLOCK_TEST_MODE=1
    -DWORDCLOCK_EXPECT_TEST_MODE=1
    -DWORDCLOCK_ENABLE_PREFIX_STATUS_PIXEL=0
    -DWORDCLOCK_ENABLE_ONBOARD_STATUS_LED=1

[env:YD_ESP32S3_N16R8_RTC_ONLY]
extends = env:YD_ESP32S3_N16R8
build_flags =
    ${env:YD_ESP32S3_N16R8.build_flags}
    -DWORDCLOCK_TEST_MODE=2
    -DWORDCLOCK_EXPECT_TEST_MODE=2
    -DWORDCLOCK_ENABLE_PREFIX_STATUS_PIXEL=0
    -DWORDCLOCK_ENABLE_ONBOARD_STATUS_LED=1
