[platformio]
default_envs = sdk
include_dir = ../../../include

[env:sdk]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#0b03321ed33fa6965114424fbb023260120c856b
build_flags =
    -Wl,--undefined=onboard_indicator_sdk_read
    -Wl,--undefined=onboard_indicator_sdk_write
