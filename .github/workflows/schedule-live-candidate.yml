# Validation candidate only: contents:read, no git commit/push/upload/deploy.
name: Schedule live page candidate
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - tools/schedule_live/**
      - .github/workflows/schedule-live-candidate.yml
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tools/schedule_live/prepare.py
      - run: python3 tools/schedule_live/check.py
      - run: npm ci --ignore-scripts
      - name: Full frontend lint, minification, inlining and gzip generation
        run: npx --no-install grunt build
      - run: python3 tools/schedule_live/check.py --built
      - name: Run all existing scheduler JS suites including binder and bridge
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests/schedule-*.test.cjs; do node "$suite"; done
  native:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [YD_ESP32S3_N16R8_BOARD_ONLY, YD_ESP32S3_N16R8_RTC_ONLY]
    env:
      BUILD_ENV: ${{ matrix.environment }}
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tools/schedule_live/prepare.py
      - name: Compile candidate application only; never upload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install platformio==6.1.18
          .ci-venv/bin/python -m platformio run -e "$BUILD_ENV"
