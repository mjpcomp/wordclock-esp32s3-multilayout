# Retired dispatch entry point. Preparation now runs in the gated same-run job.
name: Retired reviewed UI child workflow
on:
  push:
    branches: [feature/optional-status-prefix]
    paths: [.github/workflows/prepare-reviewed-ui-branch.yml]
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Use Prepare and validate reviewed UI promotion instead."
