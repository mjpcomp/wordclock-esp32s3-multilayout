name: Integrate virtual LED factory

on:
  push:
    branches: [feature/optional-status-prefix]
    paths: [.github/workflows/integrate-virtual-led-factory.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'mjpcomp/wordclock-esp32s3-multilayout'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Integrate only the reviewed factory method
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1ba4218977b67d223f5d0ac69d81f5edb295064b"
          expected=$(printf '%s\n' '.github/workflows/integrate-virtual-led-factory.yml' 'include/ClockWorkLedFactory.hpp' 'tests/test_led_factory.py' | sort)
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('include/ClockWork.hpp')
          source = path.read_bytes()
          if hashlib.sha256(source).hexdigest() != '2ce69e5ca229f543b1736badd51379fbd15dcd4b56c4b95e8e173467b7e69ea3':
              raise SystemExit('Unexpected ClockWork input; refusing to edit')
          start = source.index(b'void ClockWork::initLedStrip(')
          end = source.index(b'{', start) + 1
          depth = 1
          while depth:
              if source[end] == 123:
                  depth += 1
              elif source[end] == 125:
                  depth -= 1
              end += 1
          source = source[:start] + b'#include "ClockWorkLedFactory.hpp"' + source[end:]
          if hashlib.sha256(source).hexdigest() != 'e1d2f0f785469036125d577b4244df7a57ffdb2e1141d15bfe91a102c7e4acff':
              raise SystemExit('Unexpected ClockWork output; refusing to write')
          path.write_bytes(source)
          PY
          git diff --check
      - name: Run host regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_clock_test_foundation.py
          python3 tests/test_button_isolation.py
          python3 tests/test_english_renderer.py
          python3 tests/test_led_factory.py
      - name: Commit only the integration change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "include/ClockWork.hpp"
          test "$(git ls-remote origin refs/heads/feature/optional-status-prefix | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- include/ClockWork.hpp
          git commit -m 'fix: route test-mode LED initialization through virtual factory'
          git push origin HEAD:refs/heads/feature/optional-status-prefix
