name: Local interactive preview package
on:
  push:
    branches: [feature/optional-status-prefix, preview/local-interactive-88f2ff48]
    paths:
      - webpage/**
      - tools/local_interactive_preview.cjs
      - docs/local-interactive-preview.md
      - tests/webpage-layout.test.cjs
      - tests/mirc0-preview-simulation-browser.test.cjs
      - Gruntfile.js
      - package.json
      - package-lock.json
      - .github/workflows/local-interactive-preview.yml
  pull_request:
    paths:
      - webpage/**
      - tools/local_interactive_preview.cjs
      - docs/local-interactive-preview.md
      - tests/webpage-layout.test.cjs
      - tests/mirc0-preview-simulation-browser.test.cjs
      - Gruntfile.js
      - package.json
      - package-lock.json
      - .github/workflows/local-interactive-preview.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx --no-install grunt build
      - run: npm install --prefix .ci-browser --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - run: .ci-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check current sources and launcher isolation
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-browser/node_modules
        run: |
          node tests/mirc0-preview-simulation-browser.test.cjs
          node tools/local_interactive_preview.cjs --smoke
      - name: Assemble package and source manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path('local-interactive-preview')
          for name in ['.pio/build/webpage/index.html', 'tests/webpage-layout.test.cjs', 'tools/local_interactive_preview.cjs']:
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          shutil.copyfile('docs/local-interactive-preview.md', root / 'README.md')
          shutil.copyfile('local-preview-session.json', root / 'ci-smoke.json')
          manifest = {'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'Local simulation only; no firmware or device operations', 'playwright': '1.64.1', 'sha256': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-interactive-preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-interactive-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
