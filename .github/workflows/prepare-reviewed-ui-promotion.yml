# Verification, branch preparation, and validation use separate runners/tokens.
name: Prepare and validate reviewed UI promotion
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - tools/promote_reviewed_ui_sources.py
      - tests/test_reviewed_ui_sources.py
      - .github/workflows/prepare-reviewed-ui-promotion.yml
      - .github/workflows/prepare-reviewed-ui-branch.yml
permissions:
  contents: read
concurrency:
  group: reviewed-ui-promotion
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tests/test_reviewed_ui_sources.py
      - name: Reproduce reviewed sources and reconcile pinned manifests
        run: python3 tools/promote_reviewed_ui_sources.py verify --config-sha "$GITHUB_SHA" --bundle "$RUNNER_TEMP/reviewed-ui-bundle"
      - name: Test reproduced source without write credentials
        working-directory: ../reviewed-ui-replay
        run: |
          python3 tests/test_mirc0_preview_reference.py
          python3 tests/test_mirc0_preview.py
          python3 tools/schedule_live/check.py
          for suite in tests/schedule-*.test.cjs tests/mirc0-preview*.test.cjs; do
            case "$suite" in *-browser.test.cjs) continue ;; esac
            node "$suite"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-ui-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-ui-bundle/
          if-no-files-found: error
          retention-days: 7
  prepare:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/optional-status-prefix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.prepare.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reviewed-ui-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-ui-bundle
      - name: Create only the fixed isolated branch; no PR or merge
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote_reviewed_ui_sources.py prepare --config-sha "$GITHUB_SHA" --bundle "$RUNNER_TEMP/reviewed-ui-bundle" --target promotion/reviewed-ui-b598076f
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check exact promoted sources and receipt
        run: python3 tools/promote_reviewed_ui_sources.py check --config-sha "$GITHUB_SHA"
      - run: python3 tests/test_reviewed_ui_sources.py
      - run: npm ci --ignore-scripts
      - name: Build UI assets only
        run: |
          npx --no-install grunt build
          python3 tools/schedule_live/check.py --built
          python3 tools/promote_reviewed_ui_sources.py check --config-sha "$GITHUB_SHA"
      - name: Reuse existing isolated browser tooling
        run: |
          npm install --prefix .ci-browser --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          .ci-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise prepared UI against simulated peers
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-browser/node_modules
        run: |
          node tests/webpage-layout.test.cjs
          node tests/schedule-live-browser.test.cjs
          node tests/schedule-timeline-responsive-browser.test.cjs
          node tests/schedule-action-states-browser.test.cjs
          node tests/mirc0-preview-browser.test.cjs
          node tests/schedule-disabled-fields-browser.test.cjs
      - name: Preserve final-page overflow gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('layout-evidence/layout-report.json').read_text())
          assert report['status'] == 'PASS_DIAGNOSTICS_ONLY'
          assert len(report['measurements']) == 45
          assert all(row['documentScroll'] <= row['documentClient'] for row in report['measurements'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-ui-validation-${{ needs.prepare.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            compact-layout-evidence/
            layout-evidence/
            tools/ui-source-checkpoint.json
          if-no-files-found: warn
          retention-days: 7
