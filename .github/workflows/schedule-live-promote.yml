# One-shot, exact-candidate source promotion. No firmware upload or flag activation.
name: Promote reviewed scheduler live page
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - .github/workflows/schedule-live-promote.yml
permissions:
  contents: read
concurrency:
  group: schedule-live-promote-optional-status-prefix
  cancel-in-progress: false
env:
  CANDIDATE_BASE: 90ec718bb9ed87b5844321e7430909dcf7c702fb
jobs:
  frontend:
    if: github.repository == 'mjpcomp/wordclock-esp32s3-multilayout' && github.ref == 'refs/heads/feature/optional-status-prefix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Refuse a different base or unrelated trigger changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_BASE"
          test "$(git diff --name-only "$CANDIDATE_BASE" HEAD)" = ".github/workflows/schedule-live-promote.yml"
      - run: python3 tools/schedule_live/prepare.py
      - run: python3 tools/schedule_live/check.py
      - run: npm ci --ignore-scripts
      - run: npx --no-install grunt build
      - run: python3 tools/schedule_live/check.py --built
      - name: Run every scheduler JS suite
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests/schedule-*.test.cjs; do node "$suite"; done
  native:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [YD_ESP32S3_N16R8_BOARD_ONLY, YD_ESP32S3_N16R8_RTC_ONLY]
    env:
      BUILD_ENV: ${{ matrix.environment }}
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tools/schedule_live/prepare.py
      - name: Compile only; never upload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install platformio==6.1.18
          .ci-venv/bin/python -m platformio run -e "$BUILD_ENV"
  publish:
    needs: [frontend, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Publish exactly three reviewed source files, one per commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          def run(*args):
              subprocess.run(list(args), check=True)
          
          branch = "feature/optional-status-prefix"
          trigger = os.environ["GITHUB_SHA"]
          base = os.environ["CANDIDATE_BASE"]
          workflow = ".github/workflows/schedule-live-promote.yml"
          paths = ["Gruntfile.js", "webpage/script.js", "webpage/index.html"]
          messages = ["build: lint scheduler modules in embedded page pipeline",
                      "feat: wire scheduler to existing page socket",
                      "feat: publish scheduler configuration panel"]
          if git("rev-parse", "HEAD") != trigger or git("rev-parse", "HEAD^") != base:
              raise SystemExit("Unexpected checkout/parent; no publication")
          if git("diff", "--name-only", base, trigger) != workflow:
              raise SystemExit("Promotion trigger changed more than the approved workflow")
          remote = git("ls-remote", "origin", "refs/heads/" + branch).split()
          if not remote or remote[0] != trigger:
              raise SystemExit("Branch moved; re-review required before publication")
          run("python3", "tools/schedule_live/prepare.py")
          run("python3", "tools/schedule_live/check.py")
          if set(git("diff", "--name-only").splitlines()) != set(paths):
              raise SystemExit("Unexpected publication paths")
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths}
          run("git", "diff", "--check")
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          commits = []
          for name, message in zip(paths, messages):
              run("git", "add", "--", name)
              if git("diff", "--cached", "--name-only") != name:
                  raise SystemExit("Unexpected staged path")
              run("git", "commit", "-m", message)
              commit = git("rev-parse", "HEAD")
              commits.append((name, commit))
              print("Prepared " + commit + " for " + name, flush=True)
          run("git", "diff", "--quiet")
          run("git", "diff", "--cached", "--quiet")
          if set(git("diff", "--name-only", trigger, "HEAD").splitlines()) != set(paths):
              raise SystemExit("Unexpected final source diff")
          if any(hashlib.sha256(Path(name).read_bytes()).hexdigest() != value for name, value in hashes.items()):
              raise SystemExit("Prepared candidate content changed")
          if git("ls-remote", "origin", "refs/heads/" + branch).split()[0] != trigger:
              raise SystemExit("Branch moved during preparation; nothing pushed")
          run("git", "push", "origin", "HEAD:refs/heads/" + branch)
          if git("ls-remote", "origin", "refs/heads/" + branch).split()[0] != git("rev-parse", "HEAD"):
              raise SystemExit("Post-push branch verification failed; inspect before retrying")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Published exact scheduler candidate\n\n")
              for name, commit in commits:
                  summary.write("- `" + name + "`: `" + commit + "`, SHA-256 `" + hashes[name] + "`\n")
              summary.write("\nFrontend and both isolated builds passed before publication. No upload or activation. Retire frozen candidate/promotion workflows in a separately approved cleanup.\n")
          PY
