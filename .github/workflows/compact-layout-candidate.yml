# Applies a guarded CSS patch only inside CI; never commits or flashes it.
name: Compact layout candidate (no source promotion)
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - tools/prepare_compact_layout.py
      - .github/workflows/compact-layout-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the reviewed browser-source checkpoint
        run: git diff --exit-code 7a44bbd93c4ee6364ed1721377fcf66ea2c626ef HEAD -- webpage Gruntfile.js package.json package-lock.json tests/webpage-layout.test.cjs tests/schedule-live-browser.test.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tools/prepare_compact_layout.py
      - run: python3 tests/test_mirc0_preview_reference.py
      - run: npm ci --ignore-scripts
      - run: npx --no-install grunt build
      - name: Reuse isolated browser tooling without changing project dependencies
        run: npm install --prefix .ci-browser --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - run: .ci-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Measure the candidate and exercise existing scheduler interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-browser/node_modules
        run: |
          node tests/webpage-layout.test.cjs
          node tests/schedule-live-browser.test.cjs
      - name: Check measured overflow and density against the inspected baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('layout-evidence/layout-report.json').read_text())
          records = {row['label']: row for row in report['measurements']}
          assert report['status'] == 'PASS_DIAGNOSTICS_ONLY'
          assert len(records) == 45
          assert all(row['documentScroll'] <= row['documentClient'] for row in records.values()), 'Horizontal overflow remains'
          assert records['1024/visible']['color']['height'] < 675.5625, 'Desktop Colors panel did not shrink'
          assert records['1440/visible']['editor']['height'] < 1239.6875, 'Desktop editor did not shrink'
          assert records['320/visible']['main']['height'] < 3385.59375, 'Narrow page did not shrink'
          print('PASS: candidate measured smaller with no page overflow; virtual peer only')
          PY
      - name: Preserve candidate source, diff, measurements and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-layout-candidate-${{ github.sha }}
          path: |
            compact-layout-evidence/
            layout-evidence/
          if-no-files-found: warn
          retention-days: 7
