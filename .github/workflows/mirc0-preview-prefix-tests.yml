# Pure prefix mapping and existing phrase/lifecycle gates; no hardware output.
name: Mirc0 preview prefix mapping
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - webpage/mirc0-preview.js
      - tests/mirc0-preview-prefix.test.cjs
      - tests/mirc0-preview.test.cjs
      - tests/test_mirc0_preview.py
      - tests/test_mirc0_preview_reference.py
      - tests/fixtures/mirc0-physical-face.json
      - tests/test_mirc0_layout.cpp
      - include/WordClockTypes/**
      - .github/workflows/mirc0-preview-prefix-tests.yml
      - eslint.config.js
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - webpage/mirc0-preview.js
      - tests/mirc0-preview-prefix.test.cjs
      - tests/mirc0-preview.test.cjs
      - tests/test_mirc0_preview.py
      - tests/test_mirc0_preview_reference.py
      - tests/fixtures/mirc0-physical-face.json
      - tests/test_mirc0_layout.cpp
      - include/WordClockTypes/**
      - .github/workflows/mirc0-preview-prefix-tests.yml
      - eslint.config.js
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx --no-install eslint webpage/mirc0-preview.js
      - run: python3 tests/test_mirc0_preview_reference.py
      - run: node tests/mirc0-preview.test.cjs
      - run: node tests/mirc0-preview-prefix.test.cjs
      - run: python3 tests/test_mirc0_preview.py
