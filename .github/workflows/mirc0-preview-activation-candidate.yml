# Applies activation edits only in a disposable CI checkout. Never writes branches.
name: Mirc0 simulation activation candidate
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - tools/prepare_preview_simulation_activation.py
      - tests/test_preview_simulation_activation.py
      - tests/mirc0-preview-simulation-browser.test.cjs
      - .github/workflows/mirc0-preview-activation-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tests/test_preview_simulation_activation.py
      - run: python3 tools/prepare_preview_simulation_activation.py
      - run: npm ci --ignore-scripts
      - run: npx --no-install grunt build
      - name: Reuse existing isolated browser tooling without changing project lockfile
        run: |
          npm install --prefix .ci-browser --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          .ci-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check generated candidate against simulated peers only
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-browser/node_modules
        run: |
          node tests/mirc0-preview-page.test.cjs
          node tests/mirc0-preview-playback.test.cjs
          node tests/mirc0-preview-controls.test.cjs
          node tests/mirc0-preview-prefix.test.cjs
          node tests/mirc0-preview-simulation.test.cjs
          node tests/webpage-layout.test.cjs
          node tests/schedule-live-browser.test.cjs
          node tests/mirc0-preview-browser.test.cjs
          node tests/mirc0-preview-simulation-browser.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mirc0-activation-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview-activation-evidence/
            layout-evidence/
          if-no-files-found: warn
          retention-days: 7
