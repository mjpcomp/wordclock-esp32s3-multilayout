name: Brightness runtime model tests
on:
  push:
    branches: [feature/optional-status-prefix]
    paths:
      - include/BrightnessSchedule.h
      - include/BrightnessScheduleRuntimeModel.h
      - include/BrightnessScheduleStorage.h
      - include/BrightnessScheduleRuntimeOwner.h
      - include/BrightnessScheduleOutputBuffer.h
      - include/BrightnessScheduleStripSink.h
      - include/BrightnessScheduleRendererCache.h
      - tests/brightness_schedule_real_colors_test.cpp
      - tests/test_brightness_schedule_real_colors.py
      - platformio.ini
      - include/BrightnessScheduleRendererBinding.h
      - include/ClockWorkLedFactory.hpp
      - docs/patches/brightness-renderer-binding.patch
      - tests/test_brightness_schedule_renderer_binding.py
      - tests/test_brightness_schedule_gain_bridge.py
      - docs/patches/brightness-schedule-output.json
      - tests/test_brightness_schedule_output_candidate.py
      - include/TransitionTypes/Transition.h
      - tests/brightness_schedule_renderer_cache_test.cpp
      - tests/test_brightness_schedule_renderer_cache.py
      - include/LedStripInterface.h
      - include/NeoPixelBusLedStripAdapter.h
      - include/VirtualLedStripAdapter.h
      - include/LedStatusPrefix.h
      - tests/brightness_schedule_strip_sink_test.cpp
      - tests/test_brightness_schedule_strip_sink.py
      - tests/brightness_schedule_output_buffer_test.cpp
      - tests/test_brightness_schedule_output_buffer.py
      - src/WordClock.cpp
      - src/Led.cpp
      - include/TransitionTypes/Transition.hpp
      - include/WordClockTypes/ClockType.hpp
      - include/WordClockTypes/EN10x11.hpp
      - tests/brightness_schedule_renderer_integration_test.cpp
      - tests/test_brightness_schedule_renderer_integration.py
      - tests/brightness_schedule_application_binding_test.cpp
      - tests/test_brightness_schedule_application_binding.py
      - tests/brightness_schedule_runtime_model_test.cpp
      - tests/test_brightness_schedule_runtime_model.py
      - tests/test_brightness_schedule_runtime_owner.py
      - tests/test_brightness_schedule_offline_edges.py
      - tests/test_brightness_schedule_storage.py
      - .github/workflows/brightness-runtime-model-tests.yml
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run model, original storage and owner regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_brightness_schedule_runtime_model.py
          python3 tests/test_brightness_schedule_storage.py
          python3 tests/test_brightness_schedule_runtime_owner.py
          python3 tests/test_brightness_schedule_offline_edges.py
          python3 tests/test_brightness_schedule_application_binding.py
          python3 tests/test_brightness_schedule_output_buffer.py
          python3 tests/test_brightness_schedule_strip_sink.py
          python3 tests/test_brightness_schedule_renderer_cache.py
          python3 tests/test_brightness_schedule_renderer_integration.py
          python3 tests/test_brightness_schedule_renderer_binding.py
          python3 tests/test_brightness_schedule_gain_bridge.py
          python3 tests/test_brightness_schedule_output_candidate.py
  native-smoke:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [YD_ESP32S3_N16R8_BOARD_ONLY, YD_ESP32S3_N16R8_RTC_ONLY]
        renderer_cache: ['0', '1']
        schedule_output: ['0', '1']
        exclude:
          - renderer_cache: '0'
            schedule_output: '1'
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
      BUILD_ENV: ${{ matrix.environment }}
      RENDERER_CACHE: ${{ matrix.renderer_cache }}
      SCHEDULE_OUTPUT: ${{ matrix.schedule_output }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Stage reviewed state-only application and check isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_brightness_schedule_application_binding.py --stage-application
          for suite in clock_test_foundation button_isolation english_renderer led_factory brightness_isolation i2c_isolation rtc_isolation build_evidence prefix_status_policy onboard_diagnostic_model onboard_diagnostic_sink onboard_diagnostic_runtime; do
            python3 "tests/test_${suite}.py"
          done
      - name: Add never-called model and owner compile check (no application wiring)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('src/BrightnessRuntimeModelCompileCheck.cpp').write_text(
              '#include "BrightnessScheduleRuntimeOwner.h"\n'
              '#include "BrightnessScheduleOutputBuffer.h"\n'
              '#include "BrightnessScheduleStripSink.h"\n'
              '#include "BrightnessScheduleRendererCache.h"\n'
              '#include "BrightnessScheduleRendererBinding.h"\n'
              'static_assert(sizeof(brightnessScheduleRuntimeModel::Pixel)==4,"pixel size");\n'
              'static_assert(sizeof(brightnessScheduleRenderer::Cache<1200>)<=10000,"renderer cache budget");\n'
              'void brightnessRuntimeModelCompileCheck() {\n'
              ' brightnessScheduleRuntimeModel::Model model;\n'
              ' (void)model.sample(0,false,false,true);\n'
              ' brightnessScheduleRuntimeModel::Frame<4> frame;\n'
              ' (void)frame.configure(4); (void)frame.output(0,10000);\n'
              ' struct Sink { void writePixel(size_t,brightnessScheduleOutput::Pixel) {} void show() {} };\n'
              ' Sink sink; brightnessScheduleOutput::Buffer<4> output;\n'
              ' (void)output.configure(4); (void)output.setGain(10000); (void)output.flush(sink);\n'
              ' auto &owner = brightnessScheduleRuntimeOwner::applicationRuntime();\n'
              ' (void)owner.begin();\n'
              ' (void)owner.serviceFromClock(0,brightnessScheduleRuntimeOwner::systemLocalTime,nullptr,false,true);\n'
              '}\n'
              'void brightnessStripSinkCompileCheck(LedStripInterface &strip) {\n'
              ' brightnessScheduleOutput::StripSink sink(strip);\n'
              ' sink.writePixel(0,brightnessScheduleOutput::Pixel{1,2,3,4}); sink.show();\n'
              '}\n'
              'void brightnessRendererCacheCompileCheck(LedStripInterface &strip) {\n'
              ' brightnessScheduleRenderer::Cache<4> cache;\n'
              ' (void)cache.configure(4,brightnessScheduleRenderer::PixelMode::PhysicalRgbw);\n'
              ' (void)cache.capture(0,RgbwColor(201,103,51,127)); (void)cache.read(0);\n'
              ' brightnessScheduleOutput::StripSink sink(strip);\n'
              ' (void)cache.setGain(5000); cache.show(sink);\n'
              ' (void)cache.setGain(2500); (void)cache.repaint(sink);\n'
              '#if WORDCLOCK_ENABLE_SCHEDULE_OUTPUT\n'
              ' auto &binding = brightnessScheduleBinding::application();\n'
              ' (void)binding.adoptGain(5000); (void)binding.repaint();\n'
              '#endif\n'
              '}\n')
          PY
      - name: Stage gated renderer binding candidate in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_brightness_schedule_renderer_binding.py --stage-binding --gate "$RENDERER_CACHE"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('include/BrightnessScheduleRendererBinding.h')
          text = path.read_text()
          old = '#define WORDCLOCK_ENABLE_SCHEDULE_OUTPUT 0'
          if text.count(old) != 1:
              raise SystemExit('Schedule output default gate drift')
          path.write_text(text.replace(old, '#define WORDCLOCK_ENABLE_SCHEDULE_OUTPUT ' + os.environ['SCHEDULE_OUTPUT'], 1))
          PY
      - name: Stage remaining validated application output edits during promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_brightness_schedule_output_candidate.py --stage-output
      - name: Compile both policy paths without upload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install platformio==6.1.18
          .ci-venv/bin/python -m platformio run -e "$BUILD_ENV" -t compiledb
          .ci-venv/bin/python -m platformio run -e "$BUILD_ENV"
      - name: Run real resolved-library color tests without hardware
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_brightness_schedule_real_colors.py --environment "$BUILD_ENV"
